name: 每日更新优惠商品

on:
  push:
    paths-ignore:
      - 'docs/data.json'
  schedule:
    # 北京时间 8:30 = UTC 00:30
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许 push 回仓库

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 运行每日采集
        env:
          JD_APP_KEY: ${{ secrets.JD_APP_KEY }}
          JD_SECRET_KEY: ${{ secrets.JD_SECRET_KEY }}
          JD_SITE_ID: ${{ secrets.JD_SITE_ID }}
          JD_UNION_ID: ${{ secrets.JD_UNION_ID }}
          GH_USERNAME: Tigherzhang
          GH_REPO: jd-deals
          GH_PAGES_URL: https://tigherzhang.github.io/jd-deals/
        run: python3 scripts/daily_job.py

      - name: 提交并推送
        run: |
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过"
          else
            git commit -m "更新商品数据 $(date +%Y-%m-%d)"
            git push
          fi
